<section class="contact-section py-5">
  <div class="container">
    <h2 class="fw-bold text-center text-warning mb-4">Contact Me</h2>
    <p class="text-center text-light mb-5">I’d love to hear from you! Fill out the form below:</p>

    <div class="row justify-content-center">
      <div class="col-md-8">
        <form class="contact-form p-4 rounded shadow-lg">
          <div class="mb-3">
            <label class="form-label text-light">Name</label>
            <input type="text" class="form-control" placeholder="Enter your name">
          </div>
          <div class="mb-3">
            <label class="form-label text-light">Email</label>
            <input type="email" class="form-control" placeholder="Enter your email">
          </div>
          <div class="mb-3">
            <label class="form-label text-light">Message</label>
            <textarea class="form-control" rows="4" placeholder="Your message..."></textarea>
          </div>
          <div class="text-center">
            <button type="submit" class="btn btn-warning px-5">Send</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</section>
